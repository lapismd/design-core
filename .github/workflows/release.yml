name: Release public packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-core-public-release
  cancel-in-progress: false

jobs:
  version:
    name: Update Version Packages pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets || 'false' }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source-owned dependency intake
        run: pnpm check:dependency-intake

      - name: Guard qualified version runtime
        id: version-runtime
        if: github.event_name == 'push' && github.repository == 'lapismd/design-core' && github.ref == 'refs/heads/main'
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f # reviewed actual-recipe and intent proof
        with:
          qualification-file: .github/versioning-runtime.json
          detect-release-intent: "true"

      - name: Create repository version token
        id: version-app
        if: github.event_name == 'push' && github.repository == 'lapismd/design-core' && github.ref == 'refs/heads/main' && steps.version-runtime.outputs.hasChangesets == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: design-core
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Version Packages pull request
        id: changesets
        if: github.event_name == 'push' && github.repository == 'lapismd/design-core' && github.ref == 'refs/heads/main' && steps.version-runtime.outputs.hasChangesets == 'true'
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          commit: Version public packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.version-app.outputs.token }}

  artifact:
    name: Build verified release artifact
    needs: version
    if: needs.version.outputs.has_changesets != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
      bootstrap_required: ${{ steps.mode.outputs.bootstrap_required }}
      package_count: ${{ steps.mode.outputs.package_count }}
      should_publish: ${{ steps.mode.outputs.should_publish }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the public canonical repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = public

      - name: Install Chromium for the cold package consumer
        run: pnpm exec playwright install --with-deps chromium

      - name: Revalidate release source
        run: |
          pnpm spec:check
          pnpm release:check
          pnpm packages:pack
          pnpm checks:release

      - name: Retain packed production audit evidence
        if: always() && hashFiles('.release/production-consumer-audit.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: design-core-packed-audit-${{ github.sha }}
          path: .release/production-consumer-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Plan exact unpublished versions
        run: pnpm release:plan

      - name: Select protected publication mode
        id: mode
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const plan = JSON.parse(readFileSync(".release/release-plan.json", "utf8"));
          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("Releases must run from refs/heads/main");
          }
          const shouldPublish = plan.selected.length > 0 && !plan.bootstrapRequired;
          const output = [
            `artifact_name=design-core-release-${process.env.GITHUB_SHA}`,
            `bootstrap_required=${plan.bootstrapRequired}`,
            `package_count=${plan.selected.length}`,
            `should_publish=${shouldPublish}`,
          ].join("\n");
          appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          if (plan.bootstrapRequired && plan.selected.length > 0) {
            console.log("::notice::Initial Design Core publication requires manual npm publication from the verified release artifact.");
          }
          NODE

      - name: Prepare immutable package tarball
        if: steps.mode.outputs.package_count != '0'
        run: pnpm release:prepare

      - name: Upload verified release artifact
        if: steps.mode.outputs.package_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.mode.outputs.artifact_name }}
          path: |
            .release/release-manifest.json
            .release/tarballs/*.tgz
            .release/production-consumer-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish-production:
    name: Publish with npm trusted publishing
    needs: artifact
    if: >-
      needs.artifact.outputs.should_publish == 'true' && needs.artifact.outputs.bootstrap_required == 'false'
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@12.0.2

      - name: Download verified tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Publish exact verified tarball
        env:
          DESIGN_CORE_RELEASE_APPROVED: "1"
        run: pnpm release:publish .release/release-manifest.json

  verify:
    name: Verify installed package and provenance
    needs:
      - artifact
      - publish-production
    if: >-
      always() && needs.artifact.outputs.should_publish == 'true' && needs.publish-production.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile
          npm install --global npm@12.0.2

      - name: Download verified release manifest
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Verify clean install, integrity, and provenance
        run: >-
          pnpm release:verify .release/release-manifest.json .release/npm-signatures.json

      - name: Retain npm signature evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-signatures-${{ github.sha }}
          path: .release/npm-signatures.json
          if-no-files-found: warn
          retention-days: 90

  notes:
    name: Create package tag and GitHub release
    needs:
      - artifact
      - verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified release manifest
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.artifact.outputs.artifact_name }}
          path: .release

      - name: Create retry-safe package release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:notes .release/release-manifest.json
  notify-dependencies:
    name: Notify dependency consumers
    needs:
      - verify
    if: always() && needs.verify.result == 'success'
    permissions:
      contents: read
    uses: lapismd/dependency-automation/.github/workflows/notify.yml@ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
    with:
      automation-ref: ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
      source-sha: ${{ github.sha }}
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
