name: Visual Delta CI

on:
  pull_request:
    paths:
      - "tests/visual/**"
      - "src/**"
      - ".storybook/**"
      - "scripts/ui-generator/**"
      - "scripts/storybook-run.mjs"
      - "scripts/visual-delta-panel-update.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/visual-delta-ci.yml"

concurrency:
  group: visual-delta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-visual:
    name: Host catalog visual compare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out the UI catalog
        uses: actions/checkout@v4
        with:
          path: ui

      - name: Check out Visual Delta sibling
        uses: actions/checkout@v4
        with:
          repository: stevejuma/storybook-addon-visual-delta
          path: storybook-addon-visual-delta
          token: ${{ secrets.VISUAL_DELTA_REPO_TOKEN != '' && secrets.VISUAL_DELTA_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install UI catalog dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Visual Delta sibling dependencies
        working-directory: storybook-addon-visual-delta
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run host catalog visual compare
        run: pnpm test:visual
