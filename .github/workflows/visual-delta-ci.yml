name: Visual Delta CI

on:
  pull_request:
    paths:
      - "packages/storybook-addon-visual-delta/**"
      - "tests/visual/**"
      - "src/**"
      - ".storybook/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/visual-delta-ci.yml"

concurrency:
  group: visual-delta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Visual Delta package
        run: pnpm check:visual-delta

      - name: Run Visual Delta Vitest project
        run: pnpm exec vitest run --project visual-delta

  panel:
    name: Panel browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Visual Delta panel acceptance
        run: pnpm test:visual-delta-panel

  host-visual:
    name: Host catalog visual compare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run host catalog visual compare
        run: pnpm test:visual
